name: ' Master: TechHealth Infra Migration'

on:
    workflow_dispatch:
    push:
        branches:
            - master
permissions:
    id-token: write #required for Github OIDC

jobs:
    deploy-stack:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: Use Node.js
              uses: actions/setup-node@v1
              with:
                  node-version: '22.x'
            
            - name: Install dependencies
              run: npm install
           
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                  role-to-assume: arn:aws:iam::045283898962:role/TechHealthGithubActionsIAMRole
                  aws-region: us-east-1

            - name: Deploy Stack
              run: npx cdk deploy TechHealthInfraMigrationStack --require-approval never
                